name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: production

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [chain, loader]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install -r ../requirements-test.txt

      - name: Run pytest for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          pytest tests/ -v --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage

  build-test-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      always() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (github.event_name == 'push' || 
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'production'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for testing
        run: |
          cp example.env .env
          echo "OPENAI_API_KEY=test-key" >> .env
          echo "MODEL_NAME=test-model" >> .env

      - name: Build main service Docker images
        run: |
          echo "Building chain, loader and frontend images..."
          docker compose build --no-cache chain loader frontend
          echo "Build complete!"

      - name: Test Frontend service
        run: |
          echo "Starting Frontend service..."
          docker compose up -d --no-deps frontend
          sleep 15
          
          echo "Testing Frontend health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501)
          if [ "$response" != "200" ]; then
            echo "Frontend service health check failed with status: $response"
            docker compose logs frontend
            docker compose down
            exit 1
          fi
          echo "Frontend service is healthy (HTTP $response)"
          
          echo "Stopping Frontend service..."
          docker compose stop frontend
          docker compose down

      - name: Test Chain service
        run: |
          echo "Starting Chain service..."
          docker compose up -d --no-deps chain
          sleep 15
          
          echo "Testing Chain health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$response" != "200" ]; then
            echo "Chain service health check failed with status: $response"
            docker compose logs chain
            docker compose down
            exit 1
          fi
          echo "Chain service is healthy (HTTP $response)"
          
          echo "Stopping Chain service..."
          docker compose stop chain
          docker compose down

      - name: Test Loader service
        run: |
          echo "Starting Loader service..."
          docker compose up -d --no-deps loader
          sleep 15
          
          echo "Testing Loader health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002/health)
          if [ "$response" != "200" ]; then
            echo "Loader service health check failed with status: $response"
            docker compose logs loader
            docker compose down
            exit 1
          fi
          echo "Loader service is healthy (HTTP $response)"
          
          echo "Stopping Loader service..."
          docker compose stop loader
          docker compose down

      - name: Save Docker images as tar files
        run: |
          echo "Saving images to tar files..."
          docker save -o chain.tar enterprise_rag_blueprint-chain:latest
          docker save -o loader.tar enterprise_rag_blueprint-loader:latest
          docker save -o frontend.tar enterprise_rag_blueprint-frontend:latest
          echo "Images saved successfully!"

      - name: Check Dev secrets configured
        id: check_dev_secrets
        if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        run: |
          if [ -n "${{ secrets.DEV_HOST }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "secrets_available=true" >> $GITHUB_OUTPUT
          else
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "Dev deployment skipped: Secrets not configured"
          fi

      - name: Setup SSH key for Dev
        if: (github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')) && steps.check_dev_secrets.outputs.secrets_available == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEV_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Development
        if: (github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')) && steps.check_dev_secrets.outputs.secrets_available == 'true'
        run: |
          echo "Deploying to Development environment..."
          scp -i ~/.ssh/id_rsa \
            chain.tar \
            loader.tar \
            frontend.tar \
            ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}:${{ secrets.DEV_DEPLOY_PATH }}/
          echo "Docker images transferred successfully!"
          
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} << 'EOF'
            cd ${{ secrets.DEV_DEPLOY_PATH }}
            
            echo "Loading Docker images..."
            docker load -i chain.tar
            docker load -i loader.tar
            docker load -i frontend.tar
            
            echo "Restarting services..."
            docker compose down
            docker compose up -d
            
            echo "Deployment complete"
            
            echo "Waiting for services to be ready..."
            sleep 30
            
            echo "Checking service health..."
            if ! curl -f -s http://localhost:8000/health; then
              echo "Chain health check failed!"
              docker compose logs chain --tail 20
              exit 1
            fi
            echo "Chain is healthy"

            if ! curl -f -s http://localhost:8002/health; then
              echo "Loader health check failed!"
              docker compose logs loader --tail 20
              exit 1
            fi
            echo "Loader is healthy"
            
            if ! curl -f -s http://localhost:8501 > /dev/null; then
              echo "Frontend health check failed!"
              docker compose logs frontend --tail 20
              exit 1
            fi
            echo "Frontend is healthy"
            
            echo "Development deployment successful!"
          EOF

      - name: Check Staging secrets configured
        id: check_staging_secrets
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
        run: |
          if [ -n "${{ secrets.STAGING_HOST }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "secrets_available=true" >> $GITHUB_OUTPUT
          else
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "Staging deployment skipped: Secrets not configured"
          fi

      - name: Setup SSH key for Staging
        if: (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')) && steps.check_staging_secrets.outputs.secrets_available == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        if: (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')) && steps.check_staging_secrets.outputs.secrets_available == 'true'
        run: |
          echo "Deploying to Staging environment..."
          scp -i ~/.ssh/id_rsa \
            chain.tar \
            loader.tar \
            frontend.tar \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ secrets.STAGING_DEPLOY_PATH }}/
          echo "Docker images transferred successfully!"
          
          ssh -i ~/.ssh/id_rsa ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            
            echo "Loading Docker images..."
            docker load -i chain.tar
            docker load -i loader.tar
            docker load -i frontend.tar
            
            echo "Restarting services..."
            docker compose down
            docker compose up -d
            
            echo "Deployment complete"
            
            echo "Waiting for services to be ready..."
            sleep 30
            
            echo "Checking service health..."
            if ! curl -f -s http://localhost:8000/health; then
              echo "Chain health check failed!"
              docker compose logs chain --tail 20
              exit 1
            fi
            echo "Chain is healthy"

            if ! curl -f -s http://localhost:8002/health; then
              echo "Loader health check failed!"
              docker compose logs loader --tail 20
              exit 1
            fi
            echo "Loader is healthy"
            
            if ! curl -f -s http://localhost:8501 > /dev/null; then
              echo "Frontend health check failed!"
              docker compose logs frontend --tail 20
              exit 1
            fi
            echo "Frontend is healthy"
            
            echo "Staging deployment successful!"
          EOF

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          rm -f ~/.ssh/id_rsa
          rm -f *.tar

  deploy-production:
    name: Deploy to Production (Manual Trigger Only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    # Optional: Add GitHub Environment for deployment history visualization
    # environment: 
    #   name: production
    #   url: https://your-production-url.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for building
        run: |
          cp example.env .env
          echo "OPENAI_API_KEY=test-key" >> .env
          echo "MODEL_NAME=test-model" >> .env

      - name: Build main service Docker images
        run: |
          echo "Building chain, loader and frontend images for production..."
          docker compose build --no-cache chain loader frontend
          echo "Build complete!"

      - name: Save Docker images as tar files
        run: |
          echo "Saving images to tar files..."
          docker save -o chain.tar enterprise_rag_blueprint-chain:latest
          docker save -o loader.tar enterprise_rag_blueprint-loader:latest
          docker save -o frontend.tar enterprise_rag_blueprint-frontend:latest
          echo "Images saved successfully!"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer Docker images to Production
        run: |
          echo "Deploying to Production environment..."
          scp -i ~/.ssh/id_rsa \
            chain.tar \
            loader.tar \
            frontend.tar \
            ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/
          echo "Docker images transferred successfully!"

      - name: Run deployment script on Production
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'EOF'
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            
            echo "Loading Docker images..."
            docker load -i chain.tar
            docker load -i loader.tar
            docker load -i frontend.tar
            
            echo "Restarting services..."
            docker compose down
            docker compose up -d
            
            echo "Deployment complete"
          EOF

      - name: Verify Production deployment
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'EOF'
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            
            echo "Waiting for services to be ready..."
            sleep 15
            
            echo "Checking service health..."
            
            if ! curl -f -s http://localhost:8000/health; then
              echo "Chain health check failed!"
              docker compose logs chain --tail 20
              exit 1
            fi
            echo "Chain is healthy"

            if ! curl -f -s http://localhost:8002/health; then
              echo "Loader health check failed!"
              docker compose logs loader --tail 20
              exit 1
            fi
            echo "Loader is healthy"
            
            if ! curl -f -s http://localhost:8501 > /dev/null; then
              echo "Frontend health check failed!"
              docker compose logs frontend --tail 20
              exit 1
            fi
            echo "Frontend is healthy"
            
            echo ""
            echo "Production deployment successful!"
          EOF

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          rm -f ~/.ssh/id_rsa
          rm -f *.tar
