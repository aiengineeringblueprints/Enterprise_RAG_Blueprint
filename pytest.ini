[pytest]
# Pytest configuration for Enterprise RAG Blueprint

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = chain/tests loader/tests

# Minimum Python version
minversion = 3.8

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Disable warnings summary
    -p no:warnings
    # Coverage options
    --cov
    --cov-report=term-missing
    --cov-report=html:htmlcov
    # Fail if coverage is below threshold
    --cov-fail-under=80

# Markers for categorizing tests
markers =
    unit: Unit tests that test individual functions/methods
    integration: Integration tests that test multiple components together
    slow: Tests that take longer to run
    requires_network: Tests that require network connectivity
    requires_llm: Tests that require actual LLM access

# Test collection
collect_ignore = ['setup.py']

# Coverage options
[coverage:run]
source = chain,loader
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    */frontend/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod

[coverage:html]
directory = htmlcov
